# Project-wide Gradle settings.
# Stable troubleshooting profile for Android Studio / Gradle 9.4.1.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# Keep disabled until the project has completed a clean successful build.
# Gradle stores configuration-cache state under .gradle/configuration-cache.
org.gradle.configuration-cache=false

# Avoid reusing corrupted Kotlin incremental metadata during this clean-build release.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
